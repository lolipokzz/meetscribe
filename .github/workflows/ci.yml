name: Build and regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  java:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and smoke check
        shell: bash
        run: ./gradlew --no-daemon build :app:run --args=--check
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S capture-windows -B capture-windows/build -A x64
      - run: cmake --build capture-windows/build --config Release
      - run: ctest --test-dir capture-windows/build -C Release --output-on-failure
